<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasySpeak</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    [hidden] { display: none !important; }
    body { background-color: #f8fafc; color: #0f172a; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Шапка */
    .header { height: 52px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; flex-shrink: 0; }
    .header h1 { font-size: 18px; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .back-btn { display: none; background: #f1f5f9; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .lang-toggle { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .note-flag { position: relative; width: 36px; height: 36px; border: 1px solid #cbd5e1; border-radius: 8px 8px 8px 2px; background: #fef9c3; font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center; }
    .note-flag.show { display: flex; }
    .note-flag.album-flag { background: #dbeafe; border-radius: 8px 8px 2px 8px; }
    .note-flag.map-flag { background: #dcfce7; border-radius: 2px 8px 8px 8px; }
    .map-overlay { position: fixed; inset: 0; background: #bfe3f7; z-index: 60; display: flex; flex-direction: column; }
    .map-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffffff; border-bottom: 1px solid #cbd5e1; flex-shrink: 0; }
    .map-bar b { white-space: nowrap; }
    .map-presets { display: flex; gap: 6px; overflow-x: auto; flex: 1; min-width: 0; }
    .map-presets button { flex-shrink: 0; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 999px; background: #f8fafc; font-size: 12px; font-weight: 600; color: #334155; cursor: pointer; white-space: nowrap; }
    .map-presets button.on { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .map-stage { position: relative; flex: 1; min-height: 0; }
    .map-stage svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
    #map_world path { stroke: #64748b; stroke-width: 0.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; fill-rule: evenodd; cursor: pointer; }
    #map_world path.sel { stroke: #0f172a; stroke-width: 2; filter: brightness(0.92); }
    #map_states path { fill: none; stroke: #475569; stroke-width: 0.8; stroke-dasharray: 3 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
    #map_labels text { pointer-events: none; paint-order: stroke; stroke: rgba(255, 255, 255, 0.85); stroke-width: 3px; stroke-linejoin: round; fill: #1e293b; }
    #map_labels .cn { font-weight: 700; letter-spacing: 0.4px; }
    #map_labels .ct { font-size: 10.5px; fill: #0f172a; }
    #map_labels .st { font-size: 10px; font-style: italic; fill: #475569; letter-spacing: 0.3px; }
    #map_labels circle { fill: #dc2626; stroke: #ffffff; stroke-width: 1.2px; }
    .map-zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .map-zoom button { width: 38px; height: 38px; border: 1px solid #94a3b8; border-radius: 8px; background: #ffffff; font-size: 22px; line-height: 1; cursor: pointer; }
    .map-info { position: absolute; left: 10px; right: 10px; bottom: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 14px; min-height: 38px; display: flex; align-items: center; }
    .map-info small { color: #64748b; }
    .map-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 15px; color: #334155; background: #bfe3f7; }
    .map-status[hidden] { display: none; }
    .map-src { background: #ffffff; border-top: 1px solid #cbd5e1; padding: 6px 12px; font-size: 11px; line-height: 1.35; color: #64748b; flex-shrink: 0; }
    .note-flag.has::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; }

    /* Экраны */
    .screen { display: none; flex: 1; overflow-y: auto; padding: 16px; }
    .screen.active { display: flex; flex-direction: column; }

    /* Главная */
    .grid-menu { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; height: 100%; }
    .menu-card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    .menu-card:active { background: #f1f5f9; border-color: #cbd5e1; }
    .menu-card.c1 { background: #dbeafe; border-color: #93c5fd; }
    .menu-card.c2 { background: #ffedd5; border-color: #fdba74; }
    .menu-card.c3 { background: #dcfce7; border-color: #86efac; }
    .menu-card.c4 { background: #fef9c3; border-color: #fde047; }
    .menu-icon { display: flex; }
    .menu-icon svg { width: 84px; height: 84px; image-rendering: pixelated; }
    .menu-title { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Словарь */
    .sources-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; flex-shrink: 0; }
    .source-btn { padding: 6px 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
    .source-btn.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .source-btn .ok { color: #16a34a; }
    .source-btn .bad { color: #dc2626; }
    .source-btn.active .ok { color: #86efac; }
    .source-btn.active .bad { color: #fca5a5; }
    .check-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-shrink: 0; font-size: 12px; color: #64748b; }

    .lang-select-box { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
    .lang-select { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 600; background: #ffffff; outline: none; }
    .swap-btn { border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .search-input-box { width: 100%; margin-bottom: 12px; flex-shrink: 0; }
    .dict-search-input { width: 100%; padding: 12px 14px; border: 2px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; background: #ffffff; }
    .dict-search-input:focus { border-color: #0f172a; }

    .result-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; flex: 1; overflow-y: auto; }
    .result-placeholder { color: #94a3b8; text-align: center; margin-top: 30px; font-size: 14px; }
    .result-title { font-size: 14px; color: #64748b; font-weight: 600; margin-bottom: 4px; }
    .result-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .result-text { font-size: 22px; font-weight: 700; margin-top: 4px; word-break: break-word; }
    .result-phonetic { font-size: 14px; color: #2563eb; margin-top: 6px; font-weight: 600; background: #eff6ff; padding: 6px 10px; border-radius: 6px; display: inline-block; }
    .speak-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .speak-btn:active { background: #e2e8f0; }
    .source-note { font-size: 12px; color: #64748b; margin-top: 10px; }
    .audio-msg { font-size: 12px; color: #b91c1c; margin-top: 8px; min-height: 14px; }
    .mini-btn { padding: 6px 10px; border: none; background: #f1f5f9; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* История */
    .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .hist-head > span:first-child { font-size: 13px; color: #64748b; }
    .history-item { background: #ffffff; border: 1px solid #e2e8f0; padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .history-text { font-weight: 600; font-size: 15px; word-break: break-word; }
    .history-sub { font-size: 13px; color: #64748b; margin-top: 2px; }
    .history-phon { font-size: 12px; color: #2563eb; margin-top: 2px; }
    .history-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .history-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .page-placeholder { text-align: center; margin-top: 40px; color: #94a3b8; font-size: 15px; }

    /* Время */
    .time-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .time-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; min-width: 0; }
    .time-card.home { border-color: #0f172a; border-width: 2px; grid-column: 1 / -1; }
    .time-card.wide { grid-column: span 2; }
    .time-city { font-size: 14px; font-weight: 700; }
    .time-country { font-size: 12px; color: #64748b; }
    .time-clock { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .time-meta { font-size: 12px; color: #64748b; margin-top: 2px; display: flex; justify-content: space-between; gap: 6px; }
    .time-card.night { background: #0f172a; border-color: #0f172a; }
    .time-card.night .time-city, .time-card.night .time-clock { color: #f8fafc; }
    .time-card.night .time-country, .time-card.night .time-meta { color: #94a3b8; }

    /* Валюта */
    .cur-box { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .cur-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .cur-row input, .cur-row select { flex: 1; min-width: 0; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background: #fff; }
    .cur-result { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; word-break: break-word; }
    .cur-status { font-size: 12px; color: #64748b; margin-top: 6px; }
    .cur-list { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
    .cur-list b { font-variant-numeric: tabular-nums; text-align: right; }

    .cur-srcs { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .cur-src { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; font-size: 13px; text-align: left; cursor: pointer; color: inherit; }
    .cur-src .st { color: #64748b; }
    .cur-src.used { font-weight: 700; }
    .cur-src .ok { color: #16a34a; }
    .cur-src .bad { color: #dc2626; }

    /* Key expressions */
    .ke-top { position: sticky; top: -16px; background: #ffffff; padding: 0 0 8px; margin: -4px 0 8px; z-index: 2; }
    .ke-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .ke-chip { flex-shrink: 0; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 999px; background: #ffffff; font-size: 12px; font-weight: 600; color: #475569; cursor: pointer; white-space: nowrap; }
    .ke-chip.on { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .ke-card { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .ke-card:last-child { border-bottom: none; }
    .ke-from { font-size: 12px; color: #64748b; }
    .ke-to { font-size: 17px; font-weight: 700; word-break: break-word; margin-top: 1px; }
    .ke-tr { font-size: 13px; color: #2563eb; font-weight: 600; margin-top: 1px; }
    .ke-topic { font-size: 11px; color: #94a3b8; margin-top: 1px; }
    .ke-actions { display: flex; gap: 6px; flex-shrink: 0; }

    /* Альбом */
    .album-overlay { position: fixed; inset: 0; background: #e2e8f0; z-index: 60; display: flex; flex-direction: column; }
    .album-bar, .album-tools, .album-pages { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffffff; flex-wrap: wrap; flex-shrink: 0; }
    .album-bar { justify-content: space-between; border-bottom: 1px solid #e2e8f0; }
    .album-pages { justify-content: center; border-top: 1px solid #e2e8f0; }
    .album-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
    #albumCanvas { background: #ffffff; box-shadow: 0 2px 10px rgba(15, 23, 42, 0.2); touch-action: none; cursor: crosshair; }
    .swatches { display: flex; gap: 5px; flex-wrap: wrap; }
    .swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #cbd5e1; cursor: pointer; padding: 0; }
    .swatch.on { border-color: #0f172a; box-shadow: 0 0 0 2px #ffffff inset; }
    #albumSize { width: 90px; }
    #albumColorPick { width: 32px; height: 28px; border: none; padding: 0; background: none; }
    .mini-btn.on { background: #0f172a; color: #ffffff; }

    /* Блокнот */
    .notes-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    .notes-panel { background: #fffbeb; width: 100%; max-width: 560px; height: 70%; border-radius: 16px 16px 0 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .notes-head, .notes-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .notes-foot > span:first-child { font-size: 12px; color: #64748b; }
    .hist-btns { display: flex; gap: 6px; }
    #notesText { flex: 1; width: 100%; resize: none; border: 1px solid #fde68a; border-radius: 10px; padding: 12px; font-size: 15px; line-height: 1.5; background: #ffffff; outline: none; }
  </style>
</head>
<body>

  <div class="header">
    <button id="backBtn" class="back-btn" onclick="showHome()" data-i18n="back"></button>
    <h1 id="headerTitle">EasySpeak</h1>
    <div class="header-right">
      <select class="lang-toggle" id="langToggle" onchange="setUiLang(this.value)"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select>
      <button class="note-flag show" id="noteBtn" onclick="openNotes()">📝</button>
      <button class="note-flag show album-flag" id="albumBtn" onclick="openAlbum()">🎨</button>
      <button class="note-flag show map-flag" id="mapBtn" onclick="openMap()">🗺️</button>
    </div>
  </div>

  <div id="homeScreen" class="screen active">
    <div class="grid-menu">
      <div class="menu-card c1" onclick="openSection('dictionary')"><span class="menu-icon" data-pix="book"></span><span class="menu-title" data-i18n="sec_dictionary"></span></div>
      <div class="menu-card c2" onclick="openSection('history')"><span class="menu-icon" data-pix="hourglass"></span><span class="menu-title" data-i18n="sec_history"></span></div>
      <div class="menu-card c3" onclick="openSection('time')"><span class="menu-icon" data-pix="clock"></span><span class="menu-title" data-i18n="sec_time"></span></div>
      <div class="menu-card c4" onclick="openSection('currency')"><span class="menu-icon" data-pix="coin"></span><span class="menu-title" data-i18n="sec_currency"></span></div>
    </div>
  </div>

  <div id="dictionaryScreen" class="screen">
    <div class="sources-bar" id="sourcesBar"></div>
    <div class="check-row"><button class="mini-btn" id="checkBtn" onclick="checkSources()" data-i18n="check"></button><span id="checkStatus"></span></div>
    <div class="lang-select-box">
      <select id="fromLang" class="lang-select" onchange="handleTranslate()"></select>
      <button class="swap-btn" onclick="swapLangs()">⇄</button>
      <select id="toLang" class="lang-select" onchange="handleTranslate()"></select>
    </div>
    <div class="search-input-box">
      <input type="text" id="dictInput" class="dict-search-input" data-i18n-ph="inputPh" oninput="handleTranslate()">
    </div>
    <div class="result-box" id="resultContainer"></div>
  </div>

  <div id="historyScreen" class="screen">
    <div class="hist-head"><span id="histCount"></span><span class="hist-btns"><button class="mini-btn" onclick="copyAllHistory(this)" data-i18n="copyAll"></button> <button class="mini-btn" onclick="clearHistory()" data-i18n="clear"></button></span></div>
    <div id="historyContainer"></div>
  </div>

  <div id="timeScreen" class="screen">
    <div id="timeContainer" class="time-grid"></div>
  </div>

  <div id="currencyScreen" class="screen">
    <div class="cur-box">
      <div class="cur-row">
        <input type="number" id="curAmount" inputmode="decimal" value="100" oninput="renderCurrency()">
        <select id="curFrom" onchange="renderCurrency()"></select>
        <button class="swap-btn" onclick="swapCur()">⇄</button>
        <select id="curTo" onchange="renderCurrency()"></select>
      </div>
      <div class="cur-result" id="curResult"></div>
      <div class="cur-status" id="curStatus"></div>
    </div>
    <div class="cur-box"><div class="cur-list" id="curList"></div></div>
    <div class="cur-box">
      <div class="hist-head"><b id="curSrcTitle" data-i18n="curSources"></b><button class="mini-btn" onclick="loadRates()" data-i18n="refresh"></button></div>
      <div id="curSources" class="cur-srcs"></div>
    </div>
  </div>

  <div id="albumOverlay" class="album-overlay" hidden>
    <div class="album-bar"><b data-i18n="albumTitle"></b><span id="albumPageInfo"></span><button class="mini-btn" onclick="closeAlbum()" data-i18n="close"></button></div>
    <div class="album-tools">
      <div id="albumColors" class="swatches"></div>
      <input type="color" id="albumColorPick" value="#1e293b" oninput="setAlbumColor(this.value)">
      <input type="range" id="albumSize" min="2" max="40" value="6">
      <button class="mini-btn" id="eraserBtn" onclick="toggleEraser()" data-i18n="eraser"></button>
      <button class="mini-btn" onclick="albumUndo()" data-i18n="undo"></button>
      <button class="mini-btn" id="albumClearBtn" onclick="albumClear()" data-i18n="clear"></button>
    </div>
    <div class="album-stage" id="albumStage"><canvas id="albumCanvas" width="720" height="960"></canvas></div>
    <div class="album-pages">
      <button class="mini-btn" onclick="albumGo(-1)" data-i18n="prev"></button>
      <button class="mini-btn" onclick="albumGo(1)" data-i18n="next"></button>
      <button class="mini-btn" onclick="albumNew()" data-i18n="newPage"></button>
      <button class="mini-btn" id="albumDelBtn" onclick="albumDelete()" data-i18n="delPage"></button>
      <button class="mini-btn" onclick="albumDownload()" data-i18n="download"></button>
    </div>
  </div>

  <div id="mapOverlay" class="map-overlay" hidden>
    <div class="map-bar"><b data-i18n="mapTitle"></b><div class="map-presets" id="map_presets"></div><button class="mini-btn" onclick="closeMap()" data-i18n="close"></button></div>
    <div class="map-stage" id="map_stage">
      <svg id="map_svg"><g id="map_world"></g><g id="map_states"></g><g id="map_labels"></g></svg>
      <div class="map-zoom"><button id="map_zin" aria-label="+">+</button><button id="map_zout" aria-label="−">−</button></div>
      <div class="map-info" id="map_info"></div>
      <div class="map-status" id="map_status"></div>
    </div>
    <div class="map-src" data-i18n="mapSrc"></div>
  </div>

  <div id="notesOverlay" class="notes-overlay" hidden onclick="if (event.target === this) closeNotes()">
    <div class="notes-panel">
      <div class="notes-head"><b id="notesTitle"></b><button class="mini-btn" onclick="closeNotes()" data-i18n="close"></button></div>
      <textarea id="notesText" oninput="saveNote()" data-i18n-ph="notePh"></textarea>
      <div class="notes-foot"><span id="notesStatus"></span><span class="hist-btns"><button class="mini-btn" onclick="copyText(document.getElementById('notesText').value, this)" data-i18n="copyAll"></button> <button class="mini-btn" id="noteClearBtn" onclick="clearNote()" data-i18n="clear"></button></span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6"></script>
  <script src="https://cdn.jsdelivr.net/npm/wanakana@5.3.1/umd/wanakana.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js"></script>
  <script>
    // ---------- ТІЛ ИНТЕРФЕЙСА: қазақша (по умолчанию), русский, English ----------
    const UI = {
      kk: {
        back: '← Артқа', sec_dictionary: 'Сөздік', sec_history: 'Тарих', sec_time: 'Уақыт', sec_currency: 'Валюта',
        notes: 'Жазбалар', copyAll: 'Барлығын көшіру', close: 'Жабу', clear: 'Тазалау', confirm: 'Растау', copy: 'Көшіру', copied: 'Көшірілді', copyPrompt: 'Көшіріңіз:',

    // ---------- ПЕРЕВОД: ИСТОЧНИКИ ----------
    const gl = l => (l === 'zh' ? 'zh-CN' : l);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // fetch с ограничением по времени, ошибка при любом статусе кроме 2xx
    async function fx(url, opts = {}, ms = 7000) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), ms);
      try {
        const res = await fetch(url, Object.assign({}, opts, { signal: ctl.signal }));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res;
      } finally { clearTimeout(timer); }
    }

    // запасная латинская транскрипция
    function localRoman(text, lang) {
      try {
        if (lang === 'zh' && window.pinyinPro) return pinyinPro.pinyin(text);
        if (lang === 'ja' && window.wanakana && wanakana.isKana(text)) return wanakana.toRomaji(text);
      } catch (e) {}
      return '';
    }

    // 1. Google: перевод + латинская транскрипция (dt=rm)
    async function viaGoogle(q, from, to) {
      const res = await fx('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=rm&sl=' + gl(from) + '&tl=' + gl(to) + '&q=' + encodeURIComponent(q));
      const data = await res.json();
      const parts = data[0] || [];
      const text = parts.map(p => p[0]).filter(Boolean).join('');
      const rm = parts.filter(p => p[2]).map(p => p[2]).join(' ');
      if (!text) throw new Error('empty');
      return { text, phonetic: rm || localRoman(text, to) };
    }

    // 2. MyMemory
    async function viaMyMemory(q, from, to) {
      const res = await fx('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + gl(from) + '|' + gl(to));
      const data = await res.json();
      const text = data.responseData && data.responseData.translatedText;
      if (!text || /^MYMEMORY WARNING/i.test(text)) throw new Error('mymemory');
      return { text, phonetic: localRoman(text, to) };
    }

    const SOURCES = {
      google: { name: 'Google', fn: viaGoogle }, mymemory: { name: 'MyMemory', fn: viaMyMemory },
      keyexp: { name: 'Key expressions', local: true }
    };
    let currentSource = 'google';
    const srcStatus = {}; // результат проверки: true / false
    let currentResult = null, debounceTimer, reqId = 0;
    const audioPlayer = new Audio();

    function buildSources() {
      document.getElementById('sourcesBar').innerHTML = Object.keys(SOURCES).map(k => {
        const mark = srcStatus[k] === true ? '<span class="ok">✓</span> ' : srcStatus[k] === false ? '<span class="bad">✕</span> ' : '';
        return `<button class="source-btn${k === currentSource ? ' active' : ''}" onclick="setSource('${k}')">${mark}${SOURCES[k].name}</button>`;
      }).join('');
    }
    function setSource(k) { currentSource = k; buildSources(); handleTranslate(); }

    // Проверка: каждый сервис переводит "hello" на русский
    async function checkSources() {
      const btn = document.getElementById('checkBtn'), st = document.getElementById('checkStatus');
      btn.disabled = true; st.textContent = t('checking');
      const keys = Object.keys(SOURCES).filter(k => !SOURCES[k].local);
      await Promise.all(keys.map(async k => {
        try { await SOURCES[k].fn('hello', 'en', 'ru'); srcStatus[k] = true; } catch (e) { srcStatus[k] = false; }
      }));
      buildSources();
      st.textContent = t('checkRes', { n: keys.filter(k => srcStatus[k]).length, m: keys.length });
      btn.disabled = false;
    }

    function handleTranslate() {
      const query = document.getElementById('dictInput').value.trim();
      const box = document.getElementById('resultContainer');
      const from = document.getElementById('fromLang').value, to = document.getElementById('toLang').value;
      const id = ++reqId;
      clearTimeout(debounceTimer);
      if (currentSource === 'keyexp') { currentResult = null; renderKeyExp(); return; }
      if (!query) { currentResult = null; box.innerHTML = `<div class="result-placeholder">${t('resultPh')}</div>`; return; }
      if (from === to) { box.innerHTML = `<div class="result-placeholder">${t('sameLang')}</div>`; return; }
      box.innerHTML = `<div class="result-placeholder">${t('loading')}</div>`;

      debounceTimer = setTimeout(async () => {
        // выбранный сервис, затем два надёжных запасных
        const order = [...new Set([currentSource, 'google', 'mymemory'])];
        const failed = [];
        let r = null, used = '';
        for (const k of order) {
          try { r = await SOURCES[k].fn(query, from, to); used = k; break; } catch (e) { failed.push(SOURCES[k].name); }
        }
        if (id !== reqId) return;
        if (!r) {
          box.innerHTML = `<div class="result-placeholder">${t('allFailed')}<br><br>${t('failed')}: ${failed.join(', ')}</div>`;
          return;
        }
        currentResult = { orig: query, trans: r.text, phonetic: r.phonetic, lang: to, from, src: used, failed, ts: Date.now() };
        renderResult();
        saveToHistory(currentResult);
      }, 600);
    }

    function renderResult() {
      const r = currentResult;
      if (!r) return;
      document.getElementById('resultContainer').innerHTML = `
        <div class="result-header">
          <div class="result-title">${t('query')}: ${esc(r.orig)}</div>
          <button class="speak-btn" onclick="speak(currentResult.trans, currentResult.lang)">🔊</button>
        </div>
        <div class="result-text">${esc(r.trans)}</div>
        ${r.phonetic ? `<div class="result-phonetic">[${esc(r.phonetic)}]</div>` : ''}
        <div class="source-note">${t('source')}: ${SOURCES[r.src].name}</div>
        ${r.failed.length ? `<div class="audio-msg">${t('failed')}: ${r.failed.join(', ')}</div>` : ''}
        <div class="audio-msg" id="audioMsg"></div>`;
    }

    // Озвучка с сервера Google Translate
    function speak(text, lang) {
      const msg = document.getElementById('audioMsg');
      if (msg) msg.textContent = '';
      const fail = () => { if (msg) msg.textContent = t('audioFail'); };
      audioPlayer.onerror = fail;
      audioPlayer.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&q=' + encodeURIComponent(text.slice(0, 200)) + '&tl=' + gl(lang);
      audioPlayer.play().catch(fail);
    }

    function swapLangs() {
      const f = document.getElementById('fromLang'), o = document.getElementById('toLang');
      [f.value, o.value] = [o.value, f.value];
      handleTranslate();
    }

    // ---------- KEY EXPRESSIONS: встроенная офлайн-база ----------
    const KE_NAMES = [
      ['Негізгі','Основное','Basics'], ['Сандар мен уақыт','Числа и время','Numbers & time'], ['Әуежай','Аэропорт','Airport'],
      ['Көлік','Транспорт','Transport'], ['Қалай жетуге болады…','Как проехать до…','How to get to…'], ['Дүкен, азық-түлік','Магазин, продукты','Shop & groceries'],
      ['Ет түрлері','Виды мяса','Meats'], ['Көкөністер','Овощи','Vegetables'], ['Жемістер','Фрукты','Fruits'], ['Кафе және тамақ','Кафе и еда','Cafe & food'],
      ['Көрікті жерлер','Достопримечательности','Sights'], ['Қонақ үй','Гостиница','Hotel'], ['Киім','Одежда','Clothes'], ['Ақша','Деньги','Money'],
      ['Денсаулық, шұғыл жағдай','Здоровье и экстренные случаи','Health & emergencies'], ['Байланыс және телефон','Связь и телефон','Phone & contacts']
    ];
    let KE = null, keTopic = 0, keList = [];
    const keCache = {};

    async function loadKE() {
      if (KE) return KE;
      const bin = atob(KE_DATA), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      let text;
      if (window.DecompressionStream) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        text = await new Response(stream).text();
      } else if (window.pako) {
        text = pako.ungzip(bytes, { to: 'string' });
      } else { throw new Error('no gunzip'); }
      KE = JSON.parse(text);
      return KE;
    }
    // язык -> массив [текст, транскрипция]; разбирается один раз
    function keLang(code) {
      if (!keCache[code]) keCache[code] = KE[code].split('\n').map(l => { const i = l.indexOf('\t'); return i < 0 ? [l, ''] : [l.slice(0, i), l.slice(i + 1)]; });

    const keTopicOf = i => KE_TOPICS.findIndex(r => i >= r[0] && i < r[1]);

    async function renderKeyExp() {
      const box = document.getElementById('resultContainer');

          </div>

    // озвучка и копирование сохраняют фразу в историю

    }
    function keSpeak(k) { const e = keEntry(k); saveToHistory(e); speak(e.trans, e.lang); }
    function keCopy(k, btn) { const e = keEntry(k); saveToHistory(e); copyText(e.trans, btn); }

    // ---------- НАВИГАЦИЯ ----------

    // копирование в буфер с запасным способом
    function copyText(text, btn) {
      if (!text) return;
      const label = btn.textContent;
      const done = () => { btn.textContent = t('copied'); setTimeout(() => btn.textContent = label, 1200); };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
        ta.remove();
        if (ok) done(); else prompt(t('copyPrompt'), text);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
      else fallback();
    }

    function saveToHistory(item) {
      historyList = historyList.filter(h => !(h.orig === item.orig && h.trans === item.trans && h.lang === item.lang));

    // ---------- УАҚЫТ: города с одинаковым временем в одной карточке ----------
    function tzMs(tz, d) {
      const o = {};
      new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
        .formatToParts(d).forEach(p => o[p.type] = p.value);
      return Date.UTC(+o.year, +o.month - 1, +o.day, (+o.hour) % 24, +o.minute, +o.second);
    }
    function fmtOffset(h) {
      if (h === 0) return t('same');
      const a = Math.abs(h), hh = Math.floor(a), mm = Math.round((a - hh) * 60);
      return (h > 0 ? '+' : '−') + hh + (mm ? ':' + String(mm).padStart(2, '0') : '') + ' ' + t('hrs');
    }
    function renderTime() {
      const box = document.getElementById('timeContainer');
      const now = new Date(), i = IDX[uiLang];
      const home = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const homeMs = tzMs(home, now);
      const card = (names, sub, ms, cls) => {
        const d = new Date(ms), hour = d.getUTCHours();
        const night = hour < 6 || hour >= 21;
        const clock = String(hour).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0') + ':' + String(d.getUTCSeconds()).padStart(2, '0');
        const date = new Intl.DateTimeFormat(loc(), { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).format(d);
        const diff = (ms - homeMs) / 3600000;
        return `<div class="time-card ${cls}${night ? ' night' : ''}"><div class="time-city">${esc(names)}</div><div class="time-country">${esc(sub)}</div>
          <div class="time-clock">${clock}</div><div class="time-meta"><span>${date}</span><span>${cls === 'home' ? '' : fmtOffset(diff)}</span></div></div>`;
      };
      const groups = new Map();
      CAPITALS.forEach(c => {
        const ms = tzMs(c.tz, now);
        if (ms === homeMs && c.tz === 'Asia/Almaty') return; // ваш город уже показан сверху
        if (!groups.has(ms)) groups.set(ms, []);
        groups.get(ms).push(c);
      });
      const cards = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(([ms, list]) =>
        card(list.map(c => c.c[i]).join(' · '), [...new Set(list.map(c => c.k[i]))].join(', '), ms, list.length > 2 ? 'wide' : ''));
      box.innerHTML = card(t('ownTime'), (HOME_NAMES[home] || [home.replace('_', ' ')])[i] || home, homeMs, 'home') + cards.join('');
    }
    setInterval(() => { if (currentSection === 'time') renderTime(); }, 1000);

    // ---------- ВАЛЮТА ----------
    let rates = null, ratesNoteKey = ['ratesNone', {}], curReady = false;
    const fmtStamp = d => new Date(d).toLocaleString(loc(), { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    // Несколько источников курсов: берётся первый ответивший по порядку
    const upper = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k.toUpperCase(), v]));
    const RATE_SOURCES = [
      { name: 'open.er-api.com', url: 'https://open.er-api.com/v6/latest/USD',
        parse: d => { if (d.result !== 'success') throw 0; return { rates: d.rates, date: fmtStamp(d.time_last_update_utc) }; } },
      { name: 'currency-api (jsDelivr)', url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
        parse: d => ({ rates: upper(d.usd), date: d.date }) },
      { name: 'currency-api (Cloudflare)', url: 'https://latest.currency-api.pages.dev/v1/currencies/usd.json',
        parse: d => ({ rates: upper(d.usd), date: d.date }) },
      { name: 'exchangerate-api.com', url: 'https://api.exchangerate-api.com/v4/latest/USD',
        parse: d => ({ rates: d.rates, date: d.time_last_updated ? fmtStamp(d.time_last_updated * 1000) : d.date }) }
    ];
    const rateStatus = {};   // имя -> 'ok' | 'bad' | 'wait' (нет записи = не запрашивался)
    let rateUsed = '';

    const curLabel = c => c[0] + ' · ' + c[1 + IDX[uiLang]];
    function fillCurrencySelects() {
      ['curFrom', 'curTo'].forEach(id => {

    function renderRateSources() {
      document.getElementById('curSources').innerHTML = RATE_SOURCES.map((s, i) => {

          : st === 'wait' ? t('waitMark') : t('tapMark');
        return `<button class="cur-src${s.name === rateUsed ? ' used' : ''}" onclick="pickRateSource(${i})"><span>${s.name}${s.name === rateUsed ? ' · ' + t('usedMark') : ''}</span><span class="st">${txt}</span></button>`;
      }).join('');
    }
    // запрос к одному источнику; применяется только при успехе
    async function fetchRates(src) {
      rateStatus[src.name] = 'wait'; renderRateSources();
      try {
        const d = await (await fx(src.url, {}, 8000)).json();
        const r = src.parse(d);
        if (!r.rates || !r.rates.KZT || !r.rates.USD) throw 0;
        rateStatus[src.name] = 'ok';
        rates = r.rates;
        rateUsed = src.name;
        const fetched = fmtStamp(Date.now());
        ratesNoteKey = ['ratesNew', { s: src.name, d: r.date, f: fetched }];
        try { localStorage.setItem('travelkz_rates', JSON.stringify({ rates, date: r.date, src: src.name, fetched })); } catch (e) {}
        renderRateSources(); renderCurrency();
        return true;
      } catch (e) {
        rateStatus[src.name] = 'bad'; renderRateSources();
        return false;
      }
    }
    // автоматически: первый источник; к следующим идём только если предыдущий не ответил
    async function loadRates() {
      Object.keys(rateStatus).forEach(k => delete rateStatus[k]);
      for (const s of RATE_SOURCES) { if (await fetchRates(s)) return; }
      if (ratesNoteKey[0] !== 'ratesCached') ratesNoteKey = ['ratesNone', {}];
      renderCurrency();
    }
    // остальные источники: только по нажатию
    function pickRateSource(i) { fetchRates(RATE_SOURCES[i]); }
    function initCurrency() {
      if (!curReady) {
        fillCurrencySelects();
        document.getElementById('curFrom').value = 'KZT';
        document.getElementById('curTo').value = 'USD';
        curReady = true;
        try {
          const c = JSON.parse(localStorage.getItem('travelkz_rates') || 'null');
          if (c && c.rates) { rates = c.rates; ratesNoteKey = ['ratesCached', { s: c.src || 'open.er-api.com', d: c.date, f: c.fetched || c.date }]; }

    function swapCur() {

    function fmtMoney(v) {
      const d = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 1 ? 2 : 4;

    }
    function renderCurrency() {
      if (!curReady) return;
      const amt = parseFloat(document.getElementById('curAmount').value) || 0;
      const from = document.getElementById('curFrom').value, to = document.getElementById('curTo').value;
      document.getElementById('curStatus').textContent = t(ratesNoteKey[0], ratesNoteKey[1]);

      if (!rates || !rates[from]) {

        document.getElementById('curList').innerHTML = '';

      }
      const conv = c => amt * rates[c] / rates[from];
      document.getElementById('curResult').textContent = rates[to] ? fmtMoney(amt) + ' ' + from + ' = ' + fmtMoney(conv(to)) + ' ' + to : '—';
      document.getElementById('curList').innerHTML = CUR.filter(c => c[0] !== from && rates[c[0]])
        .map(c => `<span>${c[1 + IDX[uiLang]]}</span><b>${fmtMoney(conv(c[0]))} ${c[0]}</b>`).join('');
    }

    // ---------- ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ИНТЕРФЕЙСА ----------

    // ---------- ПИКСЕЛЬНЫЕ ИКОНКИ ГЛАВНОЙ ----------
    const PIX_PAL = { k:'#1e293b', B:'#3b82f6', W:'#ffffff', Y:'#fde047', o:'#f97316', r:'#ef4444', L:'#bae6fd', S:'#fb923c', F:'#fef9c3' };

      ],
      clock: [
        '...kkkkkk...', '..kkFFFFkk..', '.kFFFFFFFFk.', '.kFFFrrFFFk.', '.kFFFrrFFFk.', '.kFFFrrrrrk.',
        '.kFFFFFFFFk.', '.kFFFFFFFFk.', '.kFFFFFFFFk.', '..kkFFFFkk..', '...kkkkkk...', '............'

    // ---------- АЛЬБОМ (общий для всех рубрик) ----------
    const ALBUM_KEY = 'travelkz_album';

    let album = { pages: [{ strokes: [] }], cur: 0 };
    try { const a = JSON.parse(localStorage.getItem(ALBUM_KEY) || 'null'); if (a && a.pages && a.pages.length) album = a; } catch (e) {}

    function drawStroke(c, s, from) {
      c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.size; c.lineCap = 'round'; c.lineJoin = 'round';
      const p = s.pts;
      if (p.length === 1) { c.beginPath(); c.arc(p[0][0], p[0][1], s.size / 2, 0, Math.PI * 2); c.fill(); return; }
      c.beginPath();
      const start = from || 0;
      c.moveTo(p[start][0], p[start][1]);
      for (let i = start + 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]);
      c.stroke();
    }
    function redraw() {
      const c = ctx2();

    function fitCanvas() {

    function initAlbum() {

// ---------- ПРОЕКЦИЯ Natural Earth ----------
function ne(lon, lat) {

    l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4))),
    p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)))

}
const XM = ne(180, 0)[0], YM = ne(0, 90)[1], SC = 1000 / (2 * XM);
const proj = (lon, lat) => { const q = ne(lon, lat); return [(q[0] + XM) * SC, (YM - q[1]) * SC]; };

// ---------- РАЗБОР TopoJSON ----------
function decodeArcs(topo) {

  const tx = topo.transform ? topo.transform.translate[0] : 0, ty = topo.transform ? topo.transform.translate[1] : 0;
  return topo.arcs.map(arc => { let x = 0, y = 0; return arc.map(p => { x += p[0]; y += p[1]; return [x * sx + tx, y * sy + ty]; }); });
}
function ringPoints(arcs, ids) {
  const out = [];
  ids.forEach((id, n) => {
    const a = id >= 0 ? arcs[id] : arcs[~id].slice().reverse();

  arcOwners.forEach(list => { for (const a of list) for (const b of list) if (a !== b) COUNTRIES[a].nb.add(b); });

const STATES_URL = 'https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json', STATES_KEY = 'easyspeak_map_states_v1';
let STATES = [], statesState = 0; // 0 не грузили, 1 грузим, 2 готово, 3 ошибка
function maybeLoadStates() {
  if (statesState !== 0 || !COUNTRIES.length || k / k0 < 2.2) return;
  const a = proj(-128, 50), b = proj(-66, 24), vw = stage.clientWidth, vh = stage.clientHeight;
  const x0 = tx + a[0] * k, x1 = tx + b[0] * k, y0 = ty + a[1] * k, y1 = ty + b[1] * k;
  if (x1 < 0 || x0 > vw || y1 < 0 || y0 > vh) return;
  loadStates();
}
async function loadStates() {
  statesState = 1;
  try {
    let text = null;
    try { text = localStorage.getItem(STATES_KEY); } catch (e) {}
    if (!text) {
      const res = await fetch(STATES_URL); if (!res.ok) throw new Error(res.status);
      text = await res.text();
      try { localStorage.setItem(STATES_KEY, text); } catch (e) {}
    }
    const topo = JSON.parse(text), arcs = decodeArcs(topo), geoms = topo.objects.states.geometries;
    let html = '';
    geoms.forEach(g => {
      const polys = g.type === 'Polygon' ? [g.arcs] : g.type === 'MultiPolygon' ? g.arcs : [];
      let d = '', best = null;
      polys.forEach(poly => {
        const r = ringPoints(arcs, poly[0]); d += ringToD(r);
        poly.slice(1).forEach(h => { d += ringToD(ringPoints(arcs, h)); });
        const q = r.map(p => proj(p[0], p[1])); let a = 0, cx = 0, cy = 0;
        for (let i = 0; i < q.length; i++) { const p = q[i], n = q[(i + 1) % q.length], cr = p[0] * n[1] - n[0] * p[1]; a += cr; cx += (p[0] + n[0]) * cr; cy += (p[1] + n[1]) * cr; }
        const area = Math.abs(a) / 2;
        if (a && (!best || area > best.area)) best = { area, cx: cx / (3 * a), cy: cy / (3 * a) };
      });
      const nm = (g.properties && g.properties.name) || '';
      html += `<path d="${d}"></path>`;
      if (best && RU_STATES[nm]) STATES.push({ ru: RU_STATES[nm], nm, cx: best.cx, cy: best.cy });
    });
    gStates.innerHTML = html; statesState = 2; scheduleLabels();
  } catch (e) { statesState = 3; }
}

const mctx = document.createElement('canvas').getContext('2d');
const wCache = new Map();
function textW(str, size, bold) {
  const key = str + '|' + size + '|' + bold;
  if (!wCache.has(key)) { mctx.font = (bold ? 'bold ' : '') + size + 'px sans-serif'; wCache.set(key, mctx.measureText(str).width + (bold ? str.length * 0.4 : 0)); }
  return wCache.get(key);
}
let labelTimer = 0;
function scheduleLabels() { if (!labelTimer) labelTimer = requestAnimationFrame(() => { labelTimer = 0; drawLabels(); }); }
function drawLabels() {
  const vw = stage.clientWidth, vh = stage.clientHeight, placed = [];
  const hit = (b) => placed.some(p => b.x < p.x + p.w && b.x + b.w > p.x && b.y < p.y + p.h && b.y + b.h > p.y);
  let out = '';
  // страны: крупные первыми
  [...COUNTRIES].sort((a, b) => b.best.area - a.best.area).forEach(c => {
    const sx = tx + c.best.cx * k, sy = ty + c.best.cy * k, bw = c.best.w * k;
    if (sx < -50 || sy < -20 || sx > vw + 50 || sy > vh + 20) return;
    const probe = textW(dn(c), 10, true);
    if (bw < probe * 1.05) return;
    const size = Math.max(10, Math.min(19, Math.floor(bw / (dn(c).length * 0.72))));
    const w = textW(dn(c), size, true), h = size + 2;
    let lx = sx; lx = Math.max(w / 2 + 4, Math.min(vw - w / 2 - 4, lx));
    const box = { x: lx - w / 2, y: sy - h / 2, w, h };
    if (hit(box)) return;
    placed.push(box);
    out += `<text class="cn" x="${lx.toFixed(1)}" y="${(sy + size * 0.35).toFixed(1)}" font-size="${size}" text-anchor="middle">${dn(c)}</text>`;
  });
  // города
  const z = k / k0;
  if (STATES.length && z >= 3.2) STATES.forEach(s => {
    const sx = tx + s.cx * k, sy = ty + s.cy * k;
    if (sx < 0 || sy < 0 || sx > vw || sy > vh) return;
    const w = textW(sn(s), 10, false), box = { x: sx - w / 2, y: sy - 7, w, h: 14 };
    if (hit(box)) return;
    placed.push(box); out += `<text class="st" x="${sx.toFixed(1)}" y="${(sy + 3.5).toFixed(1)}" text-anchor="middle">${sn(s)}</text>`;
  });
  const tierZ = { 1: 1.25, 2: 2.6, 3: 4.8, 4: 9 };
  let dots = '', texts = '';
  CITIES.forEach(ct => {
    if (z < tierZ[ct[3]]) return;
    const p = proj(ct[2], ct[1]), sx = tx + p[0] * k, sy = ty + p[1] * k;
    if (sx < -10 || sy < -10 || sx > vw + 10 || sy > vh + 10) return;
    const cn = cname(ct[0]);
    const w = textW(cn, 10.5, false), box = { x: sx + 5, y: sy - 6, w: w + 2, h: 13 };
    dots += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="2.6"></circle>`;
    if (!hit(box)) { placed.push(box); texts += `<text class="ct" x="${(sx + 6).toFixed(1)}" y="${(sy + 3.5).toFixed(1)}">${cn}</text>`; }
  });
  gLabels.innerHTML = out + dots + texts;
}

function fitBox(lon0, lat0, lon1, lat1, pad) {
  const pts = [];
  for (let i = 0; i <= 8; i++) { const lo = lon0 + (lon1 - lon0) * i / 8; pts.push(proj(lo, lat0), proj(lo, lat1)); }
  for (let i = 0; i <= 8; i++) { const la = lat0 + (lat1 - lat0) * i / 8; pts.push(proj(lon0, la), proj(lon1, la)); }
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = stage.clientWidth, h = stage.clientHeight;
  k = Math.min(w / (x1 - x0), h / (y1 - y0)) * (pad || 0.94);
  tx = w / 2 - (x0 + x1) / 2 * k; ty = h / 2 - (y0 + y1) / 2 * k;
  clampView(); apply();
}

});
const endPtr = e => {
  if (ptrs.size === 1 && moved < 6 && startTarget) selectFrom(startTarget);
  ptrs.delete(e.pointerId);
};
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));

function selectFrom(el) {
  gWorld.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
  const path = el && el.closest ? el.closest('path[data-i]') : null;
  if (!path) { info.innerHTML = '<small>' + t('mapHint') + '</small>'; selected = -1; return; }
  path.classList.add('sel'); gWorld.appendChild(path); // поднять выбранную страну над соседями
  const c = COUNTRIES[+path.dataset.i]; selected = c.i;
  info.innerHTML = `<span><b>${dn(c)}</b> <small>${uiLang === 'en' ? '' : c.name}</small></span>`;
}

// ---------- ЗАГРУЗКА ----------
async function getTopo() {
  try { const c = localStorage.getItem(CACHE_KEY); if (c) return JSON.parse(c); } catch (e) {}
  for (const url of URLS) {
    try {
      const res = await fetch(url); if (!res.ok) throw new Error(res.status);
      const text = await res.text(), topo = JSON.parse(text);
      try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}
      return topo;
    } catch (e) {}
  }
  return null;
}
let mapStarted = false;
async function start() {
  const topo = await getTopo();
  if (!topo) {
    statusEl.innerHTML = t('mapFail'); mapStarted = false;
    return;
  }
  build(topo); drawWorld();
  statusEl.hidden = true;
  k0 = Math.min(stage.clientWidth / W0, stage.clientHeight / H0);
  buildPresets(); const p = PRESETS[0]; fitBox(p[1], p[2], p[3], p[4]);
}
window.addEventListener('resize', () => { if (document.getElementById('mapOverlay').hidden) return; k0 = Math.min(stage.clientWidth / W0, stage.clientHeight / H0); if (COUNTRIES.length) { const p = PRESETS[presetOn]; fitBox(p[1], p[2], p[3], p[4]); } });

function openMap() {
  document.getElementById('mapOverlay').hidden = false;
  k0 = Math.min(stage.clientWidth / W0, stage.clientHeight / H0);
  if (COUNTRIES.length) { buildPresets(); const p = PRESETS[presetOn]; fitBox(p[1], p[2], p[3], p[4]); return; }
  if (mapStarted) return;
  mapStarted = true; statusEl.hidden = false; statusEl.textContent = t('mapLoad');
  start();
}
function closeMap() { document.getElementById('mapOverlay').hidden = true; }
function mapRefresh() { if (COUNTRIES.length) { buildPresets(); scheduleLabels(); if (selected < 0) selectFrom(null); } }

    window.openMap = openMap; window.closeMap = closeMap; window.mapRefresh = mapRefresh;
    })();
    // ---------- СТАРТ ----------
    renderPixelIcons();
    buildSources();
    refreshNoteMark();
    refreshAlbumMark();
    fillLangSelects();
    document.getElementById('fromLang').value = 'kk';
    document.getElementById('toLang').value = 'en';
    applyLang();
  </script>
</body>
</html>
